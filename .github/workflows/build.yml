name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          print(c[-1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Picnic.xcodeproj -scheme Picnic \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-test.log | grep -E "error:|warning: unre|Test Case|PICNIC|\*\*" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build-test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: build-test.log

      - name: Build unsigned IPA
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Picnic.xcodeproj -scheme Picnic \
            -configuration Release -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/Picnic.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tail -n 30
          mkdir -p build/ipa/Payload
          cp -R build/Picnic.xcarchive/Products/Applications/Picnic.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Picnic.ipa Payload)
          ls -lh build/Picnic.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Picnic-ipa
          path: build/Picnic.ipa
