name: screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen
          python3 -m pip install --break-system-packages pillow

      - name: Build for simulator
        run: |
          xcodegen generate
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          print(c[-1]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild build -project Picnic.xcodeproj -scheme Picnic \
            -destination "id=$UDID" -derivedDataPath build/dd \
            CODE_SIGN_IDENTITY=- 2>&1 | grep -E "error|warning: .*sign|Signing|RegisterExecutionPolicy|\*\*" | tail -n 40
          ls -la build/dd/Build/Products/Debug-iphonesimulator/
          ls build/dd/Build/Products/

      - name: Prepare simulator
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          python3 tools/make_demo_photos.py demo
          xcrun simctl addmedia "$UDID" demo/*.jpg
          xcrun simctl install "$UDID" build/dd/Build/Products/Debug-iphonesimulator/Picnic.app
          mkdir -p shots

      - name: Welcome screen
        run: |
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl launch "$UDID" com.jungyounghwan.picnic >/dev/null
          sleep 6
          xcrun simctl io "$UDID" screenshot shots/01-welcome.png
          xcrun simctl terminate "$UDID" com.jungyounghwan.picnic || true

      - name: Grant photo access (UI test)
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Picnic.xcodeproj -scheme PicnicUITests -destination "id=$UDID" -derivedDataPath build/dd CODE_SIGN_IDENTITY=- 2>&1 | tail -n 25

      - name: Capture
        run: |
          APP=com.jungyounghwan.picnic
          shot() { sleep "$1"; xcrun simctl io "$UDID" screenshot "shots/$2.png"; }
          run() { xcrun simctl terminate "$UDID" $APP 2>/dev/null || true; xcrun simctl launch "$UDID" $APP "$@" >/dev/null; }

          run -PicnicInitialTab 2; shot 100 02-settings
          run -PicnicInitialTab 0; shot 8 03-search
          run -PicnicInitialTab 0 -PicnicDemoQuery picnic; shot 8 04-search-results
          run -PicnicInitialTab 1; shot 10 05-cleanup
          run -PicnicInitialTab 1 -PicnicDemoCategory similar; shot 20 06-similar
          run -PicnicInitialTab 1 -PicnicDemoCategory blurry; shot 10 07-blurry

          xcrun simctl ui "$UDID" appearance dark
          run -PicnicInitialTab 1; shot 10 08-cleanup-dark
          run -PicnicInitialTab 0; shot 8 09-search-dark

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
